name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.13.1"
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome (errors only)
        run: pnpm check:errors

      - name: Typecheck
        run: pnpm typecheck

      # Build must precede Test: the CLI suites spawn the bins, which import
      # from dist/esm and fail loudly in CI when it is missing.
      - name: Build
        run: pnpm build

      - name: Test (with coverage gate)
        run: pnpm test:coverage
